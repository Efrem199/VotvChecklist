name: Проверка
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check mobile layouts in Chrome
        run: |
          if npm run test:mobile > mobile-test.log 2>&1; then
            cat mobile-test.log
          else
            cat mobile-test.log
            while IFS= read -r line; do
              echo "::error::$line"
            done < mobile-test.log
            exit 1
          fi
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: npm run build
      - name: Проверить обновление GitHub Pages
        run: cmp dist/index.html docs/index.html
